name: Auto Sync Fork

on:
  schedule:
    - cron: '*/10 * * * *'   # 每10分钟
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Get upstream file list
        run: |
          echo "Fetching file list from upstream..."
          curl -s "https://api.github.com/repos/qwe213312/k25FCdfEOoEJ42S6/git/trees/main?recursive=1" \
            -H "Accept: application/vnd.github.v3+json" \
            | jq -r '.tree[] | select(.type == "blob") | .path' > upstream_files.txt
          
          UPSTREAM_COUNT=$(wc -l < upstream_files.txt)
          echo "Upstream has $UPSTREAM_COUNT files"
          echo "UPSTREAM_COUNT=$UPSTREAM_COUNT" >> $GITHUB_ENV
      
      - name: Get your fork file list
        run: |
          curl -s "https://api.github.com/repos/${{ github.repository }}/git/trees/main?recursive=1" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            | jq -r '.tree[] | select(.type == "blob") | .path' > fork_files.txt
          
          FORK_COUNT=$(wc -l < fork_files.txt)
          echo "Your fork has $FORK_COUNT files"
          echo "FORK_COUNT=$FORK_COUNT" >> $GITHUB_ENV
      
      - name: Find and sync new files
        run: |
          # 找出 upstream 有但 fork 没有的文件
          comm -23 <(sort upstream_files.txt) <(sort fork_files.txt) > new_files.txt
          
          NEW_COUNT=$(wc -l < new_files.txt)
          echo "Found $NEW_COUNT new files to sync"
          
          if [ $NEW_COUNT -eq 0 ]; then
            echo "✅ Already up to date"
            exit 0
          fi
          
          # 显示前10个新文件
          echo "New files (first 10):"
          head -10 new_files.txt
          
          # 逐个上传新文件
          SUCCESS=0
          FAIL=0
          
          while IFS= read -r file; do
            if [ -z "$file" ]; then continue; fi
            
            echo "Syncing: $file"
            
            # 获取文件内容并 base64
            content=$(curl -s "https://raw.githubusercontent.com/qwe213312/k25FCdfEOoEJ42S6/main/$file" | base64 -w0)
            
            # 上传到你的仓库
            response=$(curl -s -X PUT \
              "https://api.github.com/repos/${{ github.repository }}/contents/$file" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "{\"message\":\"Sync new file: $file\",\"content\":\"$content\"}")
            
            if echo "$response" | grep -q '"content"'; then
              echo "  ✅ $file synced"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ $file failed"
              FAIL=$((FAIL + 1))
            fi
          done < new_files.txt
          
          echo "========== Summary =========="
          echo "New files found: $NEW_COUNT"
          echo "Successfully synced: $SUCCESS"
          echo "Failed: $FAIL"
          echo "Upstream total: $UPSTREAM_COUNT"
          echo "Your fork total: $FORK_COUNT"
          echo "============================="
