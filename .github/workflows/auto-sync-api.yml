name: Auto Sync Fork

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Sync with shallow clone
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "bot@github.com"
          
          # 浅克隆原仓库
          git clone --depth=1 https://github.com/qwe213312/k25FCdfEOoEJ42S6.git upstream
          
          # 浅克隆你的仓库
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git fork
          
          # 复制文件
          cp -r upstream/* fork/ 2>/dev/null || true
          cp -r upstream/.git* fork/ 2>/dev/null || true
          
          # 提交并推送
          cd fork
          git add .
          git diff --cached --quiet || git commit -m "Auto sync $(date)"
          git push origin main --force
