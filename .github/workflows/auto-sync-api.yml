name: Auto Sync Fork

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync new files
        run: |
          set -e
          
          echo "Starting sync at $(date)"
          
          # 获取原仓库最新文件列表
          echo "Fetching upstream file list..."
          curl -s "https://api.github.com/repos/qwe213312/k25FCdfEOoEJ42S6/git/trees/main?recursive=1" \
            -H "Accept: application/vnd.github.v3+json" > upstream_tree.json
          
          # 提取文件路径（只取 .manifest 文件）
          cat upstream_tree.json | jq -r '.tree[] | select(.type == "blob") | .path' | grep '\.manifest$' > upstream_files.txt || true
          
          UP_COUNT=$(cat upstream_files.txt | wc -l)
          echo "Upstream manifest files: $UP_COUNT"
          
          # 获取你仓库的现有文件列表
          echo "Fetching your fork file list..."
          curl -s "https://api.github.com/repos/${{ github.repository }}/contents/" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" | jq -r '.[] | .name' | grep '\.manifest$' > fork_files.txt || true
          
          FORK_COUNT=$(cat fork_files.txt | wc -l)
          echo "Your fork manifest files: $FORK_COUNT"
          
          # 找出新文件
          comm -23 upstream_files.txt fork_files.txt > new_files.txt || true
          
          NEW_COUNT=$(cat new_files.txt | wc -l)
          echo "New files to sync: $NEW_COUNT"
          
          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "✅ Already up to date"
            exit 0
          fi
          
          # 显示前5个新文件
          echo "New files:"
          head -5 new_files.txt
          
          # 同步新文件
          SUCCESS=0
          while IFS= read -r file; do
            if [ -z "$file" ]; then continue; fi
            
            echo "Syncing: $file"
            
            # 下载文件内容
            curl -s -L "https://raw.githubusercontent.com/qwe213312/k25FCdfEOoEJ42S6/main/$file" -o temp_file
            
            # 获取文件大小
            SIZE=$(stat -c%s temp_file 2>/dev/null || stat -f%z temp_file 2>/dev/null || echo "0")
            echo "  File size: $SIZE bytes"
            
            # 上传到你的仓库
            CONTENT=$(cat temp_file | base64 -w0 2>/dev/null || cat temp_file | base64)
            
            curl -s -X PUT \
              "https://api.github.com/repos/${{ github.repository }}/contents/$file" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d "{\"message\":\"Auto sync: $file\",\"content\":\"$CONTENT\"}" > response.json
            
            if cat response.json | grep -q '"content"'; then
              echo "  ✅ Success"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ Failed"
              cat response.json
            fi
            
            rm -f temp_file
          done < new_files.txt
          
          echo "================================"
          echo "Sync completed: $SUCCESS / $NEW_COUNT files"
          echo "Upstream: $UP_COUNT | Your fork: $((FORK_COUNT + SUCCESS))"
          echo "================================"
