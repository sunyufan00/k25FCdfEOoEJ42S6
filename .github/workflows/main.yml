name: Auto Sync Fork

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/qwe213312/k25FCdfEOoEJ42S6.git
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push origin main
